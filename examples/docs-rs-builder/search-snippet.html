<div id="remixsearch-box"><form id="remixsearch-form"><input name="q" placeholder="Search crates" autocomplete="off" aria-label="Search the remixsearch crates"><button type="submit">Search</button></form><div id="remixsearch-hits" hidden></div></div>
<style>
#remixsearch-box{position:fixed;z-index:30;top:6px;left:calc(var(--desktop-sidebar-width, 200px) + 12px);width:min(26rem, calc(100vw - var(--desktop-sidebar-width, 200px) - 11rem));margin:0;padding:0;background:transparent;border:0;color:#1a1814}
#remixsearch-form{display:flex;align-items:center;height:32px;background:#fff;border:1px solid #5c564c;border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(28,25,21,.12)}
#remixsearch-form input{flex:1 1 auto;min-width:0;height:100%;margin:0;padding:0 .7rem;border:0;background:#fff;font:14px/32px "Fira Sans",sans-serif;color:#1a1814 !important}
#remixsearch-form button{flex:0 0 auto;height:100%;margin:0;padding:0 .75rem;border:0;border-left:1px solid #d9d3c7;background:#f4f0e6;font:13px/32px "Fira Sans",sans-serif;white-space:nowrap;color:#1a1814 !important;cursor:pointer}
#remixsearch-form input::placeholder{color:#4a453e !important;opacity:1}
#remixsearch-hits{margin-top:4px;max-height:16rem;overflow:auto;background:#fff;border:1px solid #5c564c;border-radius:8px;box-shadow:0 10px 24px rgba(28,25,21,.18);padding:.35rem .65rem .45rem;color:#1a1814}
#remixsearch-hits[hidden]{display:none !important}
#remixsearch-hits,#remixsearch-hits *{color:#1a1814 !important}
#remixsearch-hits a{color:#083d8c !important;text-decoration:none}
#remixsearch-hits a:hover{text-decoration:underline}
#remixsearch-hits .sum{margin:0 0 .3rem;font-size:.75rem;line-height:1.35;color:#3d3933 !important}
#remixsearch-hits .sum.weak{color:#7a1f18 !important}
#remixsearch-hits a.hit{display:block;padding:.28rem 0;border-top:1px solid #e6e0d6}
#remixsearch-hits .name{display:block;font-size:.9rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#remixsearch-hits .meta{display:block;font-size:.75rem;line-height:1.3;color:#3d3933 !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){#remixsearch-box{left:.75rem;width:calc(100vw - 1.5rem)}}
</style>
<script type="module">
const vars = document.querySelector('meta[name="rustdoc-vars"]');
const docRoot = new URL((vars && vars.dataset.rootPath) || "../", location.href);
const searchRoot = new URL("search/", docRoot);
const wasm = await import(new URL("pkg/remixsearch_wasm.js", docRoot).href);
await wasm.default();
const index = await wasm.RemixSearch.open(searchRoot.href);
document.querySelector("#remixsearch-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const query = new FormData(event.target).get("q");
  const report = JSON.parse(await index.search(String(query), 5));
  const hits = document.querySelector("#remixsearch-hits");
  const nodes = [];
  const summary = document.createElement("p");
  summary.className = report.confident ? "sum" : "sum weak";
  summary.textContent = (report.confident ? "" : "No confident match. ") + (report.summary || "");
  nodes.push(summary);
  for (const hit of report.hits || []) {
    const row = document.createElement("a");
    row.className = "hit";
    const page = String(hit.url || "").replace(/^\//, "");
    row.href = new URL(page, docRoot).href;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = hit.title;
    const meta = document.createElement("span");
    meta.className = "meta";
    const words = (hit.matched && hit.matched.length) ? hit.matched.join(", ") : "no shared words";
    meta.textContent = "cosine " + Number(hit.cosine).toFixed(2) + " · " + words;
    row.append(name, meta);
    nodes.push(row);
  }
  hits.replaceChildren(...nodes);
  hits.hidden = false;
});
</script>
