[workspace]
resolver = "2"
members = [
    "crates/remixsearch-format",
    "crates/remixsearch-infer",
    "crates/remixsearch-build",
    "crates/remixsearch-train",
    "crates/remixsearch-cli",
    "crates/remixsearch-wasm",
    "examples/docs-rs-builder",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
