[package]
name = "remixsearch-train"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Tokenizer training, EmbeddingGemma 2 teacher, and Burn distillation"

[dependencies]
remixsearch-format = { path = "../remixsearch-format" }
remixsearch-infer = { path = "../remixsearch-infer" }
remixsearch-build = { path = "../remixsearch-build" }
burn = { version = "0.22.1", default-features = false, features = [
    "std",
    "train",
    "optim",
    "tui",
    "fusion",
    "autotune",
    "wgpu",
    "metal",
    "store",
    "safetensors",
    "dataset",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
thiserror = "2"
hf-hub = { version = "1.0.0", features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
